name: Manual Release

on:
  workflow_dispatch:  # Manual trigger only
    inputs:
      version:
        description: 'Release version (e.g., v1.2.3, must match Cargo.toml)'
        required: true
        type: string
      draft:
        description: 'Create as draft?'
        required: false
        default: true
        type: boolean
      prerelease:
        description: 'Mark as prerelease?'
        required: false
        default: false
        type: boolean
      publish_cratesio:
        description: 'Publish to crates.io?'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  # ============================================================
  # 1. VALIDATE: version match + tests (crates.io needs exact version)
  # ============================================================
  validate:
    name: Validate & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Verify version matches Cargo.toml
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d '"' -f2)
          if [ "$INPUT_VERSION" != "v$CARGO_VERSION" ]; then
            echo "❌ Input version $INPUT_VERSION doesn't match Cargo.toml version v$CARGO_VERSION"
            exit 1
          fi
          echo "✅ Version matches Cargo.toml"

      - name: Run tests
        run: cargo test --release

      - name: Run clippy (linter)
        run: cargo clippy -- -D warnings

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Dry-run publish (validate package)
        run: cargo publish --dry-run --allow-dirty

  # ============================================================
  # 2. BUILD BINARIES
  # ============================================================
  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            extension: ''
            artifact_name: adjmerge-linux-x64
          # macOS Intel
          - target: x86_64-apple-darwin
            os: macos-latest
            extension: ''
            artifact_name: adjmerge-macos-x64
          # macOS Apple Silicon
          - target: aarch64-apple-darwin
            os: macos-latest
            extension: ''
            artifact_name: adjmerge-macos-aarch64
          # Windows 64-bit
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            extension: .exe
            artifact_name: adjmerge-x64.exe
          # Windows 32-bit
          - target: i686-pc-windows-msvc
            os: windows-latest
            extension: .exe
            artifact_name: adjmerge-x86.exe

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary for upload
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/adjmerge${{ matrix.extension }} artifacts/${{ matrix.artifact_name }}
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/${{ matrix.artifact_name }}

  # ============================================================
  # 3. PUBLISH TO CRATES.IO (optional, before the GH release)
  # ============================================================
  publish-cratesio:
    name: Publish to crates.io
    needs: validate
    runs-on: ubuntu-latest
    if: github.event.inputs.publish_cratesio == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ============================================================
  # 4. CREATE RELEASE (draft flag respected, like release-manual.yml)
  # ============================================================
  create-release:
    name: Create GitHub Release
    needs: [validate, build, publish-cratesio]
    if: |
      always() &&
      needs.validate.result == 'success' &&
      needs.build.result == 'success' &&
      (needs.publish-cratesio.result == 'success' || needs.publish-cratesio.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.event.inputs.version }}
          tag_name: ${{ github.event.inputs.version }}
          files: artifacts/**/*
          draft: ${{ github.event.inputs.draft }}
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
